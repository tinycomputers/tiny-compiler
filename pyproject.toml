[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyc"
version = "0.0.0"
description = "TinyCompiler: one tiny tensor language, two real chips (tiny-gpu and tiny-tpu)."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "jsonschema>=4", "black>=24.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["tinyc*", "runtime*"]

[project.scripts]
tinyc = "tinyc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
extend-exclude = "targets"

[tool.ruff]
line-length = 100
extend-exclude = ["targets"]
